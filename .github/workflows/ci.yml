name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Layering rules (PLAN §2)
        run: bun run check:deps

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # `dist/` is gitignored, so this is also the check that every published artefact can
      # be produced from a clean checkout.
      - name: Build
        run: bun run build

      - name: Verify each package's entry points exist
        run: |
          for p in ui forms charts stage2d lab-ui; do
            test -f "packages/$p/dist/index.js"
            test -f "packages/$p/dist/index.d.ts"
            test -f "packages/$p/dist/styles.css"
          done
