name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding `update-visual-baselines` re-runs CI in baseline-rewriting mode.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Each package's `stories` test project runs in Chromium (Vitest browser mode).
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Layering rules (PLAN §2)
        run: bun run check:deps

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # `dist/` is gitignored, so this is also the check that every published artefact can
      # be produced from a clean checkout.
      - name: Build
        run: bun run build

      - name: A consumer installing the packed tarballs gets working packages
        run: bun run check:consumer

      - name: Verify each package's entry points exist
        run: |
          for p in ui forms charts stage2d lab-ui; do
            test -f "packages/$p/dist/index.js"
            test -f "packages/$p/dist/index.d.ts"
            test -f "packages/$p/src/styles.css"
          done

  # ── PLAN §4 Definition-of-Done gates ─────────────────────────────────────────────────
  # Required since L1-5 (docs/measurements/dod-l1-5.md): a regression in any gate fails CI.

  dod:
    name: "DoD: ${{ matrix.gate }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, api, publint, attw, knip, size, coverage]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: matrix.gate == 'coverage'
        run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: api-extractor (report must match the committed etc/*.api.md)
        if: matrix.gate == 'api'
        run: bun run --filter './packages/*' api:check
      - if: matrix.gate != 'api'
        run: bun run ${{ matrix.gate }}

  stories:
    name: "DoD: stories (interaction, axe, SSR)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/storybook
      - run: bun run test:stories

  visual:
    name: "DoD: visual regression (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
        working-directory: apps/storybook
      - run: bun run build
        working-directory: apps/storybook
      # Baselines are made where they are enforced: label a PR `update-visual-baselines`
      # and this job rewrites them on the macOS runner and uploads them as the
      # `visual-baselines` artifact, to be committed (apps/storybook/visual/__screenshots__).
      - name: Compare with the baselines
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'update-visual-baselines') }}
        run: bun run test:visual
      - name: Rewrite the baselines
        if: ${{ contains(github.event.pull_request.labels.*.name, 'update-visual-baselines') }}
        run: bunx playwright test --update-snapshots=all
        working-directory: apps/storybook
      - uses: actions/upload-artifact@v7
        if: ${{ contains(github.event.pull_request.labels.*.name, 'update-visual-baselines') }}
        with:
          name: visual-baselines
          path: apps/storybook/visual/__screenshots__
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: |
            apps/storybook/visual-report
            apps/storybook/test-results
