name: Release

# Changesets drive releases (PLAN §7): every PR with a user-facing change carries a
# changeset; on `main` this workflow either opens/updates the "Version Packages" PR (while
# changesets are pending) or — once that PR is merged — publishes every package whose new
# version is not yet on npm, and tags it.
#
# Authorisation is npm **trusted publishing** (OIDC), not a stored token. Each package's
# trusted publisher on npmjs.com names three things that must keep matching this file:
# repository `VitalyVorobyev/lab-ui`, workflow `release.yml`, environment `npm`. A package
# name with no trusted publisher registered cannot be published from here — register it
# (npmjs.com → package → Settings → Trusted publishing) before its first release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      # The OIDC token npm exchanges for a publish credential, and signs provenance with.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # `changeset publish` runs `npm publish`, and OIDC trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      - name: Typecheck and test
        run: |
          bun run check:deps
          bun run typecheck
          bun run test
          bun run build
          bun run check:consumer

      - uses: changesets/action@v2
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"
