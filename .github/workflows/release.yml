name: Release

# Publishing is driven by a git tag: `git tag v0.2.0 && git push --tags`.
# Nothing publishes from a branch, so `main` can move without releasing, and a
# release is always a named, immutable point in history.
#
# Authorisation is npm **trusted publishing** (OIDC), not a stored token — see the
# `id-token` note below. It needs a one-time setup on npmjs.com: @vitavision/lab-ui ->
# Settings -> Trusted publishers -> GitHub Actions, repository `VitalyVorobyev/lab-ui`,
# workflow `release.yml`, no environment. Renaming this file, or moving the job into
# another workflow, stops publishing until that entry is updated to match — which is
# exactly the point: the workflow's own identity is the credential.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing. The registry authenticates *this workflow* by the
      # short-lived OIDC token GitHub mints for it — repository plus workflow file,
      # checked against the trusted publisher configured for the package on npmjs.com.
      # That token is the entire credential: there is no npm token in this repo's
      # secrets to leak, over-scope, forget to rotate, or hand to a third-party action.
      # It is also what provenance is signed with, so the tarball still records,
      # verifiably, which commit and which run produced it.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `npm publish` itself needs node — bun is used for install/build only.
      # `registry-url` is still what points the publish at npmjs.org; it simply has no
      # token to go with it any more.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Exchanging the OIDC token for a publish credential is npm CLI >= 11.5.1.
      # Upgraded explicitly rather than trusting whatever the runner's Node image
      # happens to bundle: a regression there would surface as an authentication
      # failure on a tag push, which is the worst possible place to discover it.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      # A tag that disagrees with package.json is the one failure mode of
      # tag-driven publishing: npm would take the version from the manifest and
      # silently publish something other than what the tag says. Fail instead.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match package.json version $manifest" >&2
            echo "bump the manifest and re-tag, or tag v$manifest" >&2
            exit 1
          fi
          echo "publishing $manifest"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # No `env:` block — the OIDC token above *is* the credential. `--provenance` is
      # implied by trusted publishing, but stated anyway so the signed link from tarball
      # to commit cannot quietly disappear with a change in that default. `--access
      # public` because the package is scoped, and scoped packages default to restricted.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
