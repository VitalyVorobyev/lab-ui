# The concept matrix: which file implements which UI concept, in which repo.
#
# The mapping is written by hand, on purpose. A heuristic ("anything named *Button*") both
# misses re-implementations with other names and counts wrappers as implementations; the
# point of this table is to be exactly as right as a person who read the code, and to fail
# loudly when a listed file moves (`matrix.ts` checks every path exists).
#
# Two kinds of entry per concept:
#   impl.<repo> = ["path", …]   files in that repo that *implement* the concept locally.
#   uses.<repo> = "<package>"   the repo gets the concept from a shared package instead.
#   note.<repo> = "…"           anything a reader needs that is not a file (inline markup,
#                               a third-party library, a near-miss that is not the concept).
# Paths are relative to the repo's `frontend` directory.
#
# Progress in PLAN.md is measured here, not with jscpd: cross-repo duplication is
# independent re-implementation, which copy-paste detection cannot see (F2).

# ── Repositories ────────────────────────────────────────────────────────────────────────
# `root` may start with `~`. `in_plan` is false for frontends found by the GitHub survey
# that PLAN.md §0 does not list; they are mapped, not yet in scope for migration.

[repos.lab-ui]
root = "~/vision/lab-ui"
frontend = "."
github = "VitalyVorobyev/lab-ui"
in_plan = true
manifests = [
  "packages/ui/package.json",
  "packages/forms/package.json",
  "packages/charts/package.json",
  "packages/stage2d/package.json",
  "packages/lab-ui/package.json",
  "package.json",
]

[repos.val]
label = "visual-anomaly-lab"
root = "~/vision/visual-anomaly-lab"
frontend = "frontend"
github = "VitalyVorobyev/visual-anomaly-lab"
in_plan = true

[repos.vitavision]
root = "~/vitavision"
frontend = "."
github = "VitalyVorobyev/vitavision"
in_plan = true

[repos.calibration-rs]
